<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>舒華 × Qeelin 應援企劃</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Noto+Sans+TC:wght@400;500&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F2F1EC; --paper:#F7F6F2; --ink:#111110; --soft:#6F6D67; --line:#D9D7CF; --dim:#A7A49C;
    --mono:'Inter Tight','Noto Sans TC','Noto Sans KR',-apple-system,system-ui,sans-serif;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0;}
  body{background:var(--bg); color:var(--ink); font-family:var(--mono); font-size:11.5px; line-height:1.45; letter-spacing:.03em; font-weight:500; -webkit-font-smoothing:antialiased; text-transform:none;}
  a{color:inherit;}
  button{font-family:inherit; letter-spacing:inherit;}
  button:focus-visible,a:focus-visible{outline:1px solid var(--ink); outline-offset:3px;}
  ::selection{background:var(--ink); color:var(--bg);}
  .up{text-transform:uppercase;}
  .wrap{max-width:720px; margin:0 auto; padding:0 18px;}

  /* Top bar */
  .bar{display:grid; grid-template-columns:1fr auto 1fr; align-items:start; gap:10px; padding:16px 0 0; text-transform:uppercase; font-size:10.5px;}
  .bar .c{text-align:center;}
  .lang-toggle{display:flex; justify-content:flex-end; gap:12px;}
  .lang-toggle button{background:none; border:0; padding:0; font-size:10.5px; color:var(--dim); cursor:pointer; text-transform:uppercase;}
  .lang-toggle button.active{color:var(--ink);}
  .lang-toggle button.active::before{content:"("} .lang-toggle button.active::after{content:")"}

  /* Hero */
  .hero{display:grid; grid-template-columns:1fr 1fr; gap:18px; padding:64px 0 40px; align-items:end;}
  .hero-text{align-self:start;}
  .hero-num{margin:0 0 14px;}
  .hero-eyebrow{margin:0 0 4px; text-transform:uppercase;}
  .hero-h1{margin:0; font-size:11px; font-weight:400; text-transform:uppercase;}
  .hero-h1 .x{margin:0 .4em;}
  .hero-sub{margin:0;}
  .hero-meta{margin:0; text-transform:uppercase;}
  .hero figure{margin:0;}
  .hero img{display:block; width:100%; aspect-ratio:4/5; object-fit:cover; object-position:50% 45%; filter:saturate(.9);}
  .hero figcaption{margin-top:6px; color:var(--soft); text-transform:uppercase; font-size:10px;}

  /* Event line */
  .event-row{border-top:1px solid var(--ink); padding:8px 0; }
  .event-card{display:flex; gap:14px; align-items:baseline; text-transform:uppercase;}
  .event-card .ico{color:var(--soft);}
  .event-card .nm{flex:1;}
  .live{border:1px solid var(--ink); padding:0 6px; border-radius:20px; font-size:9.5px;}

  /* Stats */
  .stat-strip{display:grid; grid-template-columns:repeat(3,1fr); border-top:1px solid var(--line); border-bottom:1px solid var(--line);}
  .stat-cell{padding:14px 0 12px;}
  .stat-cell + .stat-cell{padding-left:12px; border-left:1px solid var(--line);}
  .stat-num{display:block; font-size:34px; font-weight:400; line-height:1; letter-spacing:-.03em; font-variant-numeric:tabular-nums;}
  .stat-label{display:block; margin-top:8px; color:var(--soft); text-transform:uppercase; font-size:10px;}
  .stat-label::before{content:"("} .stat-label::after{content:")"}

  /* Section */
  .section-head{display:flex; justify-content:space-between; align-items:baseline; padding:40px 0 12px; gap:10px;}
  .section-title{margin:0; font-size:11px; font-weight:400; text-transform:uppercase;}
  .section-note{color:var(--soft); white-space:nowrap; font-size:10px; text-transform:uppercase;}
  .filter-row{display:flex; flex-wrap:wrap; gap:4px 14px; padding:0 0 14px;}
  .filter-chip{background:none; border:0; padding:2px 0; font-size:10.5px; color:var(--dim); cursor:pointer; text-transform:uppercase;}
  .filter-chip.active{color:var(--ink);}
  .filter-chip.active::before{content:"("} .filter-chip.active::after{content:")"}

  /* Task rows */
  .post-list{border-top:1px solid var(--ink);}
  .post-card{display:grid; grid-template-columns:44px 1fr auto; gap:6px 10px; align-items:center; padding:14px 0; border-bottom:1px solid var(--line); cursor:pointer; transition:background .15s;}
  .post-card:hover{background:var(--paper);}
  .post-card.done{color:var(--dim);}
  .post-card.done .post-account{text-decoration:line-through;}
  .idx{color:var(--soft); font-size:10.5px; align-self:start; padding-top:1px;}
  .pc-main{min-width:0;}
  .post-top{display:flex; align-items:baseline; gap:10px; min-width:0;}
  .plat-badge{text-transform:uppercase; font-size:10px; color:var(--soft); flex-shrink:0;}
  .plat-badge::before{content:"["} .plat-badge::after{content:"]"}
  .post-account{font-size:14px; letter-spacing:0; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .pin-mark{font-size:9.5px; text-transform:uppercase; border:1px solid currentColor; border-radius:20px; padding:0 6px; flex-shrink:0;}
  .post-note{margin:4px 0 0; color:var(--soft); font-size:10.5px;}
  .post-actions{display:flex; align-items:center; gap:12px;}
  .btn{background:none; border:0; padding:0; font-size:10.5px; color:var(--ink); cursor:pointer; text-transform:uppercase; white-space:nowrap;}
  .btn::after{content:" →";}
  .done-toggle{width:18px; height:18px; border:1px solid var(--ink); background:transparent; padding:0; font-size:11px; line-height:16px; text-align:center; cursor:pointer; color:var(--bg); flex-shrink:0;}
  .done-toggle.checked{background:var(--ink);}
  .empty-state{padding:40px 0; color:var(--soft); text-transform:uppercase; font-size:10.5px; border-bottom:1px solid var(--line);}

  footer{display:grid; grid-template-columns:1fr auto 1fr; gap:10px; padding:60px 0 22px; text-transform:uppercase; font-size:10.5px; align-items:end;}
  footer .c{text-align:center;} footer .r{text-align:right;}
  footer a{text-decoration:none; cursor:pointer;}
  #footerText{color:var(--soft); text-transform:none;}

  /* Sheet */
  .sheet-bg{position:fixed; inset:0; background:rgba(242,241,236,.72); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); z-index:50; display:none; align-items:flex-end; justify-content:center;}
  .sheet-bg.open{display:flex;}
  .sheet{background:var(--paper); width:100%; max-width:560px; max-height:90vh; overflow-y:auto; border-top:1px solid var(--ink); padding:16px 18px calc(18px + env(safe-area-inset-bottom,0px)); animation:up .25s ease-out;}
  @media (min-width:600px){ .sheet-bg{align-items:center;} .sheet{border:1px solid var(--ink);} }
  @keyframes up{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
  .sheet-head{display:flex; align-items:baseline; gap:10px; padding-bottom:12px; margin-bottom:14px; border-bottom:1px solid var(--line);}
  .sheet-acc{font-size:16px; letter-spacing:0; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .sheet-x{background:none; border:0; padding:0; font-size:10.5px; cursor:pointer; text-transform:uppercase;}
  .box{border-bottom:1px solid var(--line); padding:0 0 14px; margin-bottom:14px;}
  .box-head{display:flex; align-items:baseline; gap:14px; margin-bottom:10px; flex-wrap:wrap;}
  .box-label{flex:1; text-transform:uppercase; color:var(--soft); font-size:10px;}
  .box-label::before{content:"("} .box-label::after{content:")"}
  .mini{background:none; border:0; padding:0; font-size:10.5px; cursor:pointer; text-transform:uppercase; text-decoration:underline; text-underline-offset:3px;}
  .capseg{display:flex; gap:14px; margin-bottom:12px;}
  .capseg button{background:none; border:0; padding:0; font-size:10.5px; color:var(--dim); cursor:pointer; text-transform:uppercase;}
  .capseg button.active{color:var(--ink);}
  .capseg button.active::before{content:"("} .capseg button.active::after{content:")"}
  .cap{font-size:15px; line-height:1.55; font-family:'Noto Sans TC','Noto Sans KR',var(--mono);}
  html[lang="en"] .cap{font-family:var(--mono); font-size:15px; letter-spacing:0;}
  html[lang="ko"] .cap{font-family:'Noto Sans KR','Noto Sans TC',var(--mono);}
  .tags{white-space:pre-wrap; word-break:break-word; font-size:12px; line-height:1.7;}
  .big-rand{width:100%; background:none; border:1px dashed var(--ink); padding:14px; font-size:10.5px; cursor:pointer; text-transform:uppercase;}
  .copy-all{width:100%; background:none; border:1px solid var(--ink); padding:13px; font-size:10.5px; cursor:pointer; text-transform:uppercase; margin-bottom:10px; color:var(--ink);}
  .sheet-actions{display:flex; gap:8px;}
  .sheet-actions a,.sheet-actions button,.sheet-actions span{flex:1; text-align:center; text-decoration:none; padding:14px; font-size:10.5px; text-transform:uppercase; cursor:pointer; border:1px solid var(--ink);}
  .go-post{background:var(--ink); color:var(--bg);}
  .go-post.off{background:transparent; color:var(--dim); border-color:var(--line); cursor:default;}
  .mark-done{background:transparent; color:var(--ink);}
  .mark-done.is-done{color:var(--dim); border-color:var(--line);}
  .tips{margin:16px 0 2px; color:var(--soft); font-size:10.5px; line-height:1.9;}
  .toast{position:fixed; left:50%; bottom:calc(28px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%) translateY(16px); background:var(--ink); color:var(--bg); font-size:10.5px; text-transform:uppercase; padding:8px 14px; opacity:0; transition:.2s; z-index:60; pointer-events:none;}
  .toast.show{opacity:1; transform:translateX(-50%);}

  @media (max-width:560px){
    .hero{grid-template-columns:1fr; padding:44px 0 28px; gap:22px;}
    .hero figure{width:72%; margin-left:auto;}
    .post-card{grid-template-columns:34px 1fr auto;}
  }
  @media (prefers-reduced-motion: reduce){ *{transition:none!important; animation:none!important;} }
</style>
</head>

    <span>WWW SHUHUA</span>

    ko:{ statTotal:"전체", statDone:"완료", statPending:"남은 응원", sectionTitle:"응원 미션", updatedAt:"업데이트 ", filterAll:"전체 플랫폼", live:"진행 중",
      goEngage:"참여하기", hashtags:"HASHTAGS", copyTags:"해시태그 복사", randCap:"랜덤 멘트", randomize:"다른 멘트", copyMsg:"복사",
      copyAll:"멘트 + 해시태그 복사", goPost:"댓글 달러 가기!", noLink:"링크 준비 중", markDoneBtn:"✓ 완료", undoDone:"↺ 취소",
      copied:"복사됨 ✓", copyFail:"복사 실패, 길게 눌러 복사하세요",
      tips:"❤️ 좋아요, 리포스트, 저장<br>📝 멘트 복사 → 댓글에 붙여넣기{TAG}<br>📱 멘트 + # → 게시물 / 릴스 올리기 (공유하고 저장 ✨)<br>#️⃣ #만 복사 → 스토리에 붙여넣기 (효과 더 좋아요)",
      markDone:"완료 표시", emptyView:"게시물을 정리하고 있어요. 새 게시물은 여기에 올라와요.", loadErr:"미션 목록을 불러오지 못했어요. 새로고침해 주세요.",
      post:"게시물", footer:"팬들이 직접 정리" }
  };
  var CAP_LABEL = { zh:"中文", en:"English", ko:"한국어" };

  var posts = [], lastUpdated = null, loadError = false, activeFilter = "all";
  var lang = "zh", capLang = null;
  function get(k,d){ try{ var v=localStorage.getItem(k); return v==null?d:v; }catch(e){ return d; } }
  function put(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  var sl = get("sq_lang",""); if(STR[sl]) lang = sl;
  var cs = get("sq_caplang",""); if(CAPTIONS[cs]) capLang = cs;
  var myDone = {}; try{ myDone = JSON.parse(get("sq_my_done","{}")) || {}; }catch(e){}
  function t(k){ return STR[lang][k]; }

  function postKey(p){ var s=p.platform+"||"+p.account+"||"+p.link; var h=5381; for(var i=0;i<s.length;i++){ h=((h*33)^s.charCodeAt(i))>>>0; } return h.toString(36); }
  function toggleMyDone(key){ myDone[key]=!myDone[key]; put("sq_my_done",JSON.stringify(myDone)); render(); }
  function escapeHtml(s){ return (s||"").replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function fmtDate(ts){ var d=new Date(ts); return (d.getMonth()+1)+"/"+d.getDate()+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
  function todayStr(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

  var HOSTS = [[/(^|\.)instagram\.com$|(^|\.)instagr\.am$/,"IG"],[/(^|\.)(x|twitter)\.com$/,"X"],[/(^|\.)tiktok\.com$/,"TT"],[/(^|\.)(facebook|fb)\.com$|(^|\.)fb\.watch$/,"FB"],[/(^|\.)youtube\.com$|(^|\.)youtu\.be$/,"YT"],[/(^|\.)weibo\.(com|cn)$/,"WB"],[/(^|\.)douyin\.com$/,"DY"],[/(^|\.)threads\.(net|com)$/,"TH"],[/(^|\.)xiaohongshu\.com$|(^|\.)xhslink\.com$/,"XHS"]];
  function parseUrl(l){ try{ return new URL(/^https?:\/\//i.test(l)?l:"https://"+l); }catch(e){ return null; } }
  function detectPlatform(l){ var u=parseUrl(l); if(!u) return "其他"; var h=u.hostname.toLowerCase(); for(var i=0;i<HOSTS.length;i++){ if(HOSTS[i][0].test(h)) return HOSTS[i][1]; } return "其他"; }
  function detectAccount(l){
    var u=parseUrl(l); if(!u) return ""; var pl=detectPlatform(l);
    var seg=u.pathname.split("/").filter(Boolean); var f=seg[0]||"";
    if(f.charAt(0)==="@") return f;
    if(pl==="X" && f && !/^(i|intent|home|search|hashtag|share)$/i.test(f)) return "@"+f;
    if(pl==="IG"){ if(f==="stories"&&seg[1]) return "@"+seg[1]; if(f && !/^(p|reel|reels|tv|explore|share|s)$/i.test(f)) return "@"+f; }
    return "";
  }
  var platformOrder = ["IG","X","TH","TT","FB","YT","WB","DY","XHS","其他"];
  var PLAT_FULL = {
    zh:{IG:"Instagram",X:"X",TT:"TikTok",FB:"Facebook",YT:"YouTube",TH:"Threads",WB:"微博",DY:"抖音",XHS:"小紅書"},
    en:{IG:"Instagram",X:"X",TT:"TikTok",FB:"Facebook",YT:"YouTube",TH:"Threads",WB:"Weibo",DY:"Douyin",XHS:"RedNote"},
    ko:{IG:"Instagram",X:"X",TT:"TikTok",FB:"Facebook",YT:"YouTube",TH:"Threads",WB:"웨이보",DY:"더우인",XHS:"샤오홍슈"}
  };
  function platName(pl){ return PLAT_FULL[lang][pl] || pl; }
  function accLabel(p){ return p.account || (platName(p.platform)+" "+t("post")); }
  function truthy(v){ return v===true || /^true$/i.test(String(v||"").trim()); }
  function normalize(list){
    return list.map(function(r,i){
      var link=(r.link||"").trim();
      return { platform:(r.platform||"").trim()||detectPlatform(link), account:(r.account||"").trim()||detectAccount(link), link:link,
        note:(r.note||"").trim(), pinned:truthy(r.pinned), favorite:truthy(r.favorite), done:truthy(r.done), hashtags:(r.hashtags||"").trim(), addedAt:i };
    }).filter(function(p){ return p.account||p.link; });
  }
  function parseCsv(text){
    var rows=[],row=[],field="",q=false;
    for(var i=0;i<text.length;i++){ var c=text[i];
      if(q){ if(c==='"'){ if(text[i+1]==='"'){field+='"';i++;} else q=false; } else field+=c; }
      else if(c==='"') q=true; else if(c===','){row.push(field);field="";} else if(c==='\n'){row.push(field);rows.push(row);row=[];field="";} else if(c!=='\r') field+=c; }
    if(field.length||row.length){row.push(field);rows.push(row);}
    if(!rows.length) return [];
    var hdr=rows[0].map(function(h){return h.trim().toLowerCase();});
    return rows.slice(1).map(function(r){ var o={}; hdr.forEach(function(h,i){o[h]=r[i]||"";}); return o; });
  }

  function renderHeader(){
    var h=header[lang];
    document.documentElement.lang = lang==="zh"?"zh-Hant":lang;
    document.querySelectorAll("#langToggle button").forEach(function(b){ b.classList.toggle("active", b.getAttribute("data-lang")===lang); });
    document.getElementById("titleText").innerHTML=h.title;
    var sb=document.getElementById("subtitleText"); sb.textContent=h.sub; sb.hidden=!h.sub;
    document.getElementById("periodText").textContent=h.period;
    document.getElementById("metaText").textContent=h.meta;
    document.title = lang==="zh" ? "舒華 × Qeelin 應援企劃" : lang==="ko" ? "슈화 × Qeelin 응원 프로젝트" : "SHUHUA × QEELIN Fan Project";
    var live = todayStr()===EVENT.date;
    document.getElementById("eventCard").innerHTML='<span class="ico">(SEOUL)</span><span class="nm">'+h.event+'</span><span class="dt">'+h.eventDate+'</span>'+(live?'<span class="live">'+t("live")+'</span>':'');
    ["statTotal","statDone","statPending"].forEach(function(k){ document.getElementById(k+"Label").textContent=t(k); });
    document.getElementById("sectionTitle").textContent=t("sectionTitle");
    document.getElementById("footerText").textContent=t("footer");
  }

  function render(){
    renderHeader();
    var sorted=posts.slice().sort(function(a,b){
      var ad=a.done||!!myDone[postKey(a)], bd=b.done||!!myDone[postKey(b)];
      if(ad!==bd) return ad?1:-1;
      if(a.pinned!==b.pinned) return a.pinned?-1:1;
      if(a.favorite!==b.favorite) return a.favorite?-1:1;
      return a.addedAt-b.addedAt;
    });
    var done=sorted.filter(function(p){ return p.done||!!myDone[postKey(p)]; }).length;
    document.getElementById("statTotal").textContent=sorted.length;
    document.getElementById("statDone").textContent=done;
    document.getElementById("statPending").textContent=sorted.length-done;
    document.getElementById("lastUpdated").textContent=lastUpdated?(t("updatedAt")+fmtDate(lastUpdated)):"";

    var present={}; sorted.forEach(function(p){ present[p.platform]=true; });
    if(activeFilter!=="all" && !present[activeFilter]) activeFilter="all";
    var chips=['<button class="filter-chip'+(activeFilter==="all"?" active":"")+'" data-f="all">'+t("filterAll")+'</button>'];
    platformOrder.forEach(function(pl){ if(present[pl]) chips.push('<button class="filter-chip'+(activeFilter===pl?" active":"")+'" data-f="'+pl+'">'+escapeHtml(platName(pl))+'</button>'); });
    document.getElementById("filterRow").innerHTML=chips.join("");

    var visible=activeFilter==="all"?sorted:sorted.filter(function(p){ return p.platform===activeFilter; });
    var listEl=document.getElementById("postList");
    if(loadError && !posts.length) listEl.innerHTML='<div class="empty-state">'+t("loadErr")+'</div>';
    else if(!visible.length) listEl.innerHTML='<div class="empty-state">'+t("emptyView")+'</div>';
    else listEl.innerHTML=visible.map(function(p,i){
      var key=postKey(p), checked=!!myDone[key], eff=p.done||checked;
      return '<div class="post-card'+(eff?" done":"")+'" data-key="'+key+'">'+
        '<span class="idx">('+String(i+1).padStart(2,"0")+')</span>'+
        '<div class="pc-main"><div class="post-top"><span class="plat-badge">'+escapeHtml(platName(p.platform))+'</span>'+
        '<span class="post-account">'+escapeHtml(accLabel(p))+'</span>'+
        (p.pinned?'<span class="pin-mark">Pin</span>':'')+(p.favorite?'<span class="pin-mark">★</span>':'')+'</div>'+
        (p.note?'<p class="post-note">'+escapeHtml(p.note)+'</p>':'')+'</div>'+
        '<div class="post-actions"><button class="btn">'+t("goEngage")+'</button>'+
        '<button class="done-toggle'+(checked?" checked":"")+'" data-key="'+key+'" aria-label="'+t("markDone")+'" title="'+t("markDone")+'">'+(checked?"✓":"")+'</button></div></div>';
    }).join("");
    document.querySelectorAll(".filter-chip").forEach(function(el){ el.onclick=function(){ activeFilter=el.getAttribute("data-f"); render(); }; });
    document.querySelectorAll(".done-toggle").forEach(function(el){ el.onclick=function(e){ e.stopPropagation(); toggleMyDone(el.getAttribute("data-key")); }; });
    document.querySelectorAll(".post-card").forEach(function(el){ el.onclick=function(){ openSheet(el.getAttribute("data-key")); }; });
    if(sheetKey) renderSheet();
  }

  document.querySelectorAll("#langToggle button").forEach(function(b){ b.addEventListener("click",function(){ lang=b.getAttribute("data-lang"); put("sq_lang",lang); render(); }); });

  // ---------- 彈窗 ----------
  var sheetKey=null, curCaption="";
  function findPost(k){ for(var i=0;i<posts.length;i++){ if(postKey(posts[i])===k) return posts[i]; } return null; }
  function curCapLang(){ return capLang || lang; }
  function pickCaption(){ var list=CAPTIONS[curCapLang()]; var c; do{ c=list[Math.floor(Math.random()*list.length)]; }while(c===curCaption && list.length>1); return c; }
  function tagsOf(p){ var v=p.hashtags?p.hashtags:(Object.prototype.hasOwnProperty.call(DEFAULT_HASHTAGS,p.platform)?DEFAULT_HASHTAGS[p.platform]:DEFAULT_HASHTAGS._all); return (v||"").replace(/\\n/g,"\n"); }
  function openSheet(k){ sheetKey=k; curCaption=""; document.getElementById("sheetBg").classList.add("open"); document.body.style.overflow="hidden"; renderSheet(); }
  function closeSheet(){ sheetKey=null; document.getElementById("sheetBg").classList.remove("open"); document.body.style.overflow=""; }
  function renderSheet(){
    var p=findPost(sheetKey); if(!p){ closeSheet(); return; }
    var mine=!!myDone[sheetKey], tags=tagsOf(p);
    var ctag=Object.prototype.hasOwnProperty.call(COMMENT_TAGS,p.platform)?COMMENT_TAGS[p.platform]:COMMENT_TAGS._all;
    var tagTxt = ctag ? (lang==="zh"?"，並 tag "+ctag : lang==="ko"?", "+ctag+" 태그" : " with "+ctag) : "";
    var seg='<div class="capseg">'+["zh","en","ko"].map(function(l){ return '<button data-cl="'+l+'" class="'+(curCapLang()===l?"active":"")+'">'+CAP_LABEL[l]+'</button>'; }).join("")+'</div>';
    var capHtml = curCaption
      ? '<div class="box-head"><span class="box-label">'+t("randCap")+'</span><button class="mini" id="btnRand">'+t("randomize")+'</button><button class="mini" id="btnCopyCap">'+t("copyMsg")+'</button></div>'+seg+'<div class="cap">'+escapeHtml(curCaption)+'</div>'
      : '<div class="box-head"><span class="box-label">'+t("randCap")+'</span></div>'+seg+'<button class="big-rand" id="btnRand">'+t("randCap")+' +</button>';
    var go = p.link ? '<a class="go-post" href="'+escapeHtml(p.link)+'" target="_blank" rel="noopener">'+t("goPost")+'</a>' : '<span class="go-post off">'+t("noLink")+'</span>';
    document.getElementById("sheet").innerHTML=
      '<div class="sheet-head"><span class="plat-badge">'+escapeHtml(platName(p.platform))+'</span><span class="sheet-acc">'+escapeHtml(accLabel(p))+'</span>'+
      (p.pinned?'<span class="pin-mark">Pin</span>':'')+(p.favorite?'<span class="pin-mark">★</span>':'')+
      '<button class="sheet-x" id="btnClose" aria-label="close">(Close)</button></div>'+
      (p.note?'<p class="post-note" style="margin:0 2px 12px">'+escapeHtml(p.note)+'</p>':'')+
      '<div class="box">'+capHtml+'</div>'+
      (tags?'<div class="box"><div class="box-head"><span class="box-label">'+t("hashtags")+'</span><button class="mini" id="btnCopyTags">'+t("copyTags")+'</button></div><div class="tags">'+escapeHtml(tags)+'</div></div>':'')+
      (curCaption&&tags?'<button class="copy-all" id="btnCopyAll">'+t("copyAll")+'</button>':'')+
      '<div class="sheet-actions">'+go+'<button class="mark-done'+(mine?" is-done":"")+'" id="btnDone">'+(mine?t("undoDone"):t("markDoneBtn"))+'</button></div>'+
      '<p class="tips">'+(function(){ var l=t("tips").replace("{TAG}",tagTxt).split("<br>"); return (tags?l:l.slice(0,2)).join("<br>"); })()+'</p>';
    document.getElementById("btnClose").onclick=closeSheet;
    document.getElementById("btnRand").onclick=function(){ curCaption=pickCaption(); renderSheet(); };
    document.querySelectorAll(".capseg button").forEach(function(b){ b.onclick=function(){ capLang=b.getAttribute("data-cl"); put("sq_caplang",capLang); curCaption=curCaption?pickCaption():""; renderSheet(); }; });
    var ct=document.getElementById("btnCopyTags"); if(ct) ct.onclick=function(){ copyText(tags); };
    var c1=document.getElementById("btnCopyCap"); if(c1) c1.onclick=function(){ copyText(curCaption); };
    var c2=document.getElementById("btnCopyAll"); if(c2) c2.onclick=function(){ copyText(curCaption+"\n\n"+tags); };
    document.getElementById("btnDone").onclick=function(){ var was=!!myDone[sheetKey]; toggleMyDone(sheetKey); if(!was) closeSheet(); };
  }
  document.getElementById("sheetBg").addEventListener("click",function(e){ if(e.target.id==="sheetBg") closeSheet(); });
  document.addEventListener("keydown",function(e){ if(e.key==="Escape"&&sheetKey) closeSheet(); });

  var toastTimer;
  function toast(m){ var el=document.getElementById("toast"); el.textContent=m; el.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(function(){ el.classList.remove("show"); },1400); }
  function copyText(text){
    function fb(){ var ta=document.createElement("textarea"); ta.value=text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0,text.length); var ok=false; try{ ok=document.execCommand("copy"); }catch(e){} document.body.removeChild(ta); toast(ok?t("copied"):t("copyFail")); }
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(function(){ toast(t("copied")); },fb); } else fb();
  }

  function loadData(){
    if(!CSV_URL) return;
    fetch(CSV_URL+(CSV_URL.indexOf("?")>-1?"&":"?")+"_="+Date.now(),{cache:"no-store"})
      .then(function(r){ if(!r.ok) throw new Error("http "+r.status); return r.text(); })
      .then(function(txt){ posts=normalize(parseCsv(txt)); lastUpdated=Date.now(); loadError=false; render(); })
      .catch(function(){ if(!posts.length) loadError=true; render(); });
  }

  posts = normalize(POSTS);
  if(posts.length) lastUpdated = Date.now();
  render();
  loadData();
  if(CSV_URL) setInterval(loadData, 60000);
})();
</script>
</body>
